<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SMOKEEZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0712;
    --panel:#150f1f;
    --panel2:#1d1530;
    --panel3:#241a38;
    --line:#2b2240;
    --line-soft:#221a35;
    --text:#f4eefb;
    --muted:#9c8fb0;
    --muted-dim:#6f6485;
    --magenta:#e34fef;
    --violet:#8b5cf6;
    --ok:#34d399;
    --no:#fb7185;
    --gold:#fbbf24;
    --radius:16px;
    --nav-h:64px;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-style:italic;
    text-transform:uppercase;
    letter-spacing:0.01em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--magenta);color:#100815;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

  /* ---------- background atmosphere ---------- */
  .smoke-field{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    background:
      radial-gradient(60% 50% at 15% 8%, rgba(139,92,246,0.28), transparent 60%),
      radial-gradient(50% 45% at 90% 15%, rgba(227,79,239,0.20), transparent 60%),
      radial-gradient(70% 60% at 50% 100%, rgba(139,92,246,0.14), transparent 60%),
      var(--bg);
  }
  .smoke-field .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.35;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .smoke-field .b1{width:60vw;height:60vw;background:var(--violet);top:-15%;left:-20%;}
  .smoke-field .b2{width:55vw;height:55vw;background:var(--magenta);top:25%;right:-25%;animation-delay:-8s;}
  .smoke-field .b3{width:50vw;height:50vw;background:#5b21b6;bottom:-15%;left:20%;animation-delay:-14s;}
  @keyframes drift{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(3%, 4%) scale(1.08);}
  }
  .particle{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(227,79,239,0.6), rgba(139,92,246,0.15) 60%, transparent 75%);
    filter:blur(1px);
    opacity:0;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    8%{opacity:0.55;}
    88%{opacity:0.3;}
    100%{transform:translateY(-115vh) translateX(var(--drift,24px)); opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .smoke-field .blob, .particle{animation:none;}
    html{scroll-behavior:auto;}
  }

  /* ---------- header ---------- */
  header.topbar{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 16px;
    background:rgba(11,7,18,0.78);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand img{height:26px;display:block;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    position:relative;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:1rem;
  }
  .icon-btn .badge{
    position:absolute;top:-4px;right:-4px;
    min-width:17px;height:17px;padding:0 4px;
    border-radius:99px;
    background:linear-gradient(135deg, var(--magenta), var(--violet));
    color:#fff;font-size:0.62rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- layout / views ---------- */
  main#app{
    max-width:640px;
    margin:0 auto;
    padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 26px);
    min-height:calc(100vh - 54px);
  }
  .view{display:none;animation:fadeIn .22s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .section-title{
    font-size:1.05rem;
    color:var(--text);
    margin:18px 2px 12px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .count{font-family:'JetBrains Mono',monospace;font-style:normal;font-size:0.72rem;color:var(--muted-dim);text-transform:none;letter-spacing:0;}

  /* ---------- filter bar ---------- */
  .search-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .search-wrap{position:relative;margin-bottom:0;flex:1 1 auto;min-width:0;}
  .search-wrap input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:0.9rem;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--magenta);}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:0.5;width:14px;height:14px;}
  .stock-toggle{display:flex;align-items:center;gap:7px;font-size:0.72rem;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;flex:0 0 auto;}
  .stock-toggle .box{width:32px;height:19px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .15s;flex:0 0 auto;}
  .stock-toggle .box::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted-dim);transition:all .15s;}
  .stock-toggle input{display:none;}
  .stock-toggle input:checked + .box{background:rgba(52,211,153,0.25);border-color:var(--ok);}
  .stock-toggle input:checked + .box::after{left:15px;background:var(--ok);}
  .chip-filters{
    display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;
    padding:2px 2px 6px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .chip-filters::-webkit-scrollbar{display:none;height:0;}
  .cat-chip{
    flex:0 0 auto;
    padding:8px 15px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .cat-chip.active{
    background:linear-gradient(135deg, var(--magenta), var(--violet));
    color:#fff;
    border-color:transparent;
  }

  /* ---------- product grid / cards ---------- */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-top:12px;
  }
  .product-card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
    display:flex;flex-direction:column;
  }
  .product-card:active{transform:scale(0.97);}
  .product-card:hover{border-color:var(--muted-dim);}
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:linear-gradient(150deg, var(--panel2), var(--panel3));
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;padding:14px;}
  .thumb .placeholder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    color:var(--muted-dim);
    text-align:center;
    padding:10px;
  }
  .thumb .placeholder svg{width:30px;height:30px;opacity:0.5;}
  .thumb .placeholder span{font-size:0.62rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;line-height:1.3;}
  .thumb .tag{
    position:absolute;top:8px;left:8px;
    padding:3px 9px;
    border-radius:99px;
    font-size:0.62rem;
    font-weight:800;
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .tag.promo{background:var(--gold);color:#1a1305;}
  .tag.out{background:rgba(251,113,133,0.18);color:var(--no);border:1px solid rgba(251,113,133,0.4);}
  .fav-btn{
    position:absolute;top:8px;right:8px;z-index:2;
    width:30px;height:30px;border-radius:50%;
    background:rgba(11,7,18,0.55);
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    font-size:0.95rem;cursor:pointer;
    color:#fff;
    transition:transform .15s ease;
  }
  .fav-btn:active{transform:scale(0.88);}
  .fav-btn.active{color:var(--magenta);}
  .pd-hero .fav-btn{top:14px;right:14px;width:38px;height:38px;font-size:1.2rem;}
  .card-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card-body .name{font-size:0.84rem;font-weight:700;line-height:1.25;color:var(--text);}
  .card-body .meta{font-size:0.68rem;color:var(--muted-dim);font-family:'JetBrains Mono',monospace;}
  .card-body .price{margin-top:auto;font-family:'Oswald',sans-serif;font-style:italic;font-size:1.05rem;color:var(--magenta);padding-top:4px;}
  .card-body .price.ask{font-size:0.74rem;color:var(--muted);font-style:normal;font-family:'Manrope',sans-serif;font-weight:700;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted-dim);}
  .empty-state svg{width:40px;height:40px;opacity:0.4;margin-bottom:12px;}

  /* ---------- product detail ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .pd-hero{
    width:100%;aspect-ratio:1/1;max-height:340px;
    border-radius:var(--radius);
    background:linear-gradient(150deg, var(--panel2), var(--panel3));
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    border:1px solid var(--line-soft);
  }
  .pd-hero img{width:100%;height:100%;object-fit:contain;padding:28px;}
  .pd-hero .placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted-dim);text-align:center;padding:20px;}
  .pd-hero .placeholder svg{width:52px;height:52px;opacity:0.5;}
  .pd-hero .placeholder span{font-size:0.72rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
  .pd-title{margin-top:16px;font-size:1.5rem;color:var(--text);}
  .pd-price{margin-top:6px;font-family:'Oswald',sans-serif;font-style:italic;font-size:1.3rem;color:var(--magenta);}
  .pd-price.ask{font-family:'Manrope',sans-serif;font-style:normal;font-size:0.95rem;color:var(--muted);}
  .pd-desc{margin-top:12px;color:var(--muted);font-size:0.88rem;line-height:1.55;}
  .pd-block{margin-top:20px;}
  .pd-block .lbl{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted-dim);font-family:'JetBrains Mono',monospace;margin-bottom:10px;}
  .flavor-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .flavor-chip{
    padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:0.82rem;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .12s ease;
  }
  .flavor-chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .flavor-chip.selected{background:linear-gradient(135deg, var(--magenta), var(--violet));border-color:transparent;color:#fff;}
  .flavor-chip.out{opacity:0.4;cursor:not-allowed;color:var(--muted-dim);text-decoration:line-through;}
  .qty-stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);}
  .qty-stepper button{width:40px;height:40px;border:none;background:transparent;color:var(--text);font-size:1.1rem;cursor:pointer;}
  .qty-stepper button:active{background:var(--panel2);}
  .qty-stepper .val{min-width:34px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;}
  .pd-actions{display:flex;gap:10px;margin-top:24px;}
  .pd-note{margin-top:14px;font-size:0.76rem;color:var(--muted-dim);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;border-radius:999px;font-weight:700;font-size:0.86rem;
    font-family:inherit;text-decoration:none;border:1px solid transparent;
    cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    white-space:nowrap;flex:1;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(135deg, var(--magenta), var(--violet));color:#fff;box-shadow:0 8px 24px -8px rgba(227,79,239,0.55);}
  .btn-ghost{background:rgba(255,255,255,0.03);border-color:var(--line);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.07);}
  .btn-wide{width:100%;flex:none;}
  .btn-block{display:flex;width:100%;}

  /* ---------- cart ---------- */
  .cart-item{
    display:flex;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;margin-bottom:10px;
  }
  .cart-item .thumb-sm{width:56px;height:56px;flex:0 0 auto;border-radius:10px;overflow:hidden;background:var(--panel2);display:flex;align-items:center;justify-content:center;}
  .cart-item .thumb-sm img{width:100%;height:100%;object-fit:contain;padding:6px;}
  .cart-item .thumb-sm svg{width:22px;height:22px;opacity:0.4;}
  .cart-item .ci-info{flex:1;min-width:0;}
  .cart-item .ci-name{font-weight:700;font-size:0.86rem;}
  .cart-item .ci-flavor{font-size:0.76rem;color:var(--muted);margin-top:2px;}
  .cart-item .ci-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .cart-item .ci-price{font-family:'JetBrains Mono',monospace;color:var(--magenta);font-size:0.82rem;font-weight:700;}
  .cart-item .qty-stepper button{width:30px;height:30px;font-size:0.95rem;}
  .cart-item .rm{background:none;border:none;color:var(--muted-dim);cursor:pointer;font-size:1rem;padding:4px;}
  .cart-summary{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:16px;margin-top:16px;
  }
  .cart-summary .row{display:flex;justify-content:space-between;font-size:0.86rem;color:var(--muted);margin-bottom:6px;}
  .cart-summary .row.total{color:var(--text);font-weight:800;font-size:1.05rem;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);}
  .cart-summary .row.total span:last-child{color:var(--magenta);font-family:'JetBrains Mono',monospace;}

  /* ---------- checkout ---------- */
  .co-step{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:16px;margin-bottom:14px;}
  .co-step .co-title{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted-dim);font-family:'JetBrains Mono',monospace;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .co-step .co-title .n{width:19px;height:19px;border-radius:50%;background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:800;}
  .method-toggle{display:flex;gap:8px;}
  .method-toggle button{
    flex:1;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);font-weight:700;font-size:0.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .method-toggle button .ic{font-size:1.3rem;}
  .method-toggle button.active{border-color:var(--magenta);background:rgba(227,79,239,0.12);color:var(--text);}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:0.76rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input, .field select{
    width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:0.88rem;outline:none;
  }
  .field input:focus{border-color:var(--magenta);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .contact-toggle{display:flex;gap:8px;margin-bottom:10px;}
  .contact-toggle button{
    flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);font-weight:700;font-size:0.8rem;cursor:pointer;
  }
  .contact-toggle button.active{border-color:var(--violet);background:rgba(139,92,246,0.15);color:var(--text);}
  .pay-options{display:flex;flex-direction:column;gap:8px;}
  .pay-opt{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);cursor:pointer;font-size:0.86rem;font-weight:600;
  }
  .pay-opt .radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--muted-dim);flex:0 0 auto;position:relative;}
  .pay-opt.active{border-color:var(--magenta);background:rgba(227,79,239,0.1);}
  .pay-opt.active .radio{border-color:var(--magenta);}
  .pay-opt.active .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--magenta);}
  .co-error{color:var(--no);font-size:0.78rem;margin-top:8px;}
  .order-review-row{display:flex;justify-content:space-between;font-size:0.83rem;padding:6px 0;border-bottom:1px dashed var(--line-soft);color:var(--muted);}
  .order-review-row span:last-child{color:var(--text);text-align:right;max-width:60%;}

  .success-box{text-align:center;padding:40px 16px;}
  .success-box .ic{font-size:3rem;margin-bottom:14px;}
  .success-box h2{font-size:1.4rem;color:var(--text);margin-bottom:10px;}
  .success-box p{color:var(--muted);font-size:0.88rem;line-height:1.6;max-width:340px;margin:0 auto;}

  /* ---------- profile ---------- */
  .profile-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:20px;text-align:center;}
  .profile-avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg, var(--magenta), var(--violet));display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:#fff;overflow:hidden;}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;}
  .profile-name{font-size:1.15rem;font-weight:800;}
  .profile-username{color:var(--muted-dim);font-size:0.82rem;font-family:'JetBrains Mono',monospace;margin-top:2px;}
  .promo-box{margin-top:18px;padding:14px;border-radius:14px;background:var(--panel2);border:1px dashed var(--magenta);}
  .promo-box .lbl{font-size:0.7rem;text-transform:uppercase;color:var(--muted-dim);letter-spacing:0.06em;margin-bottom:6px;}
  .promo-box .code{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700;color:var(--gold);letter-spacing:0.05em;}
  .promo-box .hint{font-size:0.74rem;color:var(--muted);margin-top:6px;}
  .copy-mini{margin-top:10px;padding:8px 16px;font-size:0.76rem;}
  .orders-list{margin-top:10px;}
  .order-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .order-card .oc-top{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);margin-bottom:6px;}
  .order-card .oc-items{font-size:0.8rem;color:var(--text);line-height:1.5;}
  .order-card .oc-total{margin-top:6px;font-weight:800;color:var(--magenta);font-family:'JetBrains Mono',monospace;font-size:0.88rem;}
  .guest-note{margin-top:14px;font-size:0.78rem;color:var(--muted-dim);text-align:center;line-height:1.5;}

  /* ---------- bottom nav ---------- */
  nav.bottom-nav{

/* ======================================================================
   ПОДГОТОВКА ТОВАРОВ
   ====================================================================== */
function slugify(str){
  const map = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  return str.toLowerCase().split('').map(ch=>map[ch]!==undefined?map[ch]:ch).join('')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function priceFor(line){
  if(line.category === 'liquid'){
    if(/^Vozol Prime/i.test(line.name)) return 11.00;
    if(/^ElfLiq/i.test(line.name)) return 11.00;
    if(/^Chaser/i.test(line.name)) return 10.50;
  }
  if(line.category === 'pod'){
    if(/^Vaporesso Xros 4 Mini/i.test(line.name)) return 16.90;
    if(/^Vaporesso Xros 5 Mini/i.test(line.name)) return 20.90;
    if(/^Vaporesso Xros 5(?!\s*Mini)/i.test(line.name)) return 25.90;
    if(/^Vaporesso Xros Pro 2/i.test(line.name)) return 32.90;
  }
  if(line.name === 'Картриджи Xros') return 4.00;
  if(line.category === 'snus') return 5.00;
  if(line.promo){
    const m = line.promo.match(/([\d,.]+)\s*€/);
    if(m) return parseFloat(m[1].replace(',','.'));
  }
  return null;
}
function unitFor(line){
  if(line.category === 'liquid') return 'флакон';
  if(line.category === 'snus') return 'банка';
  return 'шт';
}
function variantLabelFor(line){
  if(line.category === 'liquid' || line.category === 'disposable' || line.category === 'snus') return 'Вкус';
  if(/картридж/i.test(line.name)) return 'Вариант';
  return 'Цвет';
}

const PRODUCTS = RAW.map((line, idx) => {
  const id = 'p' + idx + '-' + slugify(line.name);
  return {
    id,
    idx,
    name: line.name,
    category: line.category,
    items: line.items,
    price: priceFor(line),
    unit: unitFor(line),
    variantLabel: variantLabelFor(line),
    desc: line.desc || '',
    note: line.note || '',
    promo: line.promo || '',
    img: 'images/' + slugify(line.name) + '.png'
  };
});
/* Список ожидаемых файлов изображений (положи их в папку images/ рядом с index.html,

}
function haptic(type){
  if(!tg || !tg.HapticFeedback) return;
  try{
    if(type==='success' || type==='error' || type==='warning') tg.HapticFeedback.notificationOccurred(type);
    else tg.HapticFeedback.impactOccurred(type||'light');
  }catch(e){}
}

/* ======================================================================
   ИДЕНТИФИКАЦИЯ / ХРАНИЛИЩЕ
   ====================================================================== */
function getUid(){
  if(tgUser && tgUser.id) return 'tg' + tgUser.id;
  let g = localStorage.getItem('smokeez_guest_id');
  if(!g){ g = 'guest' + Math.random().toString(36).slice(2,10); localStorage.setItem('smokeez_guest_id', g); }
  return g;
}
const UID = getUid();
function storeGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function storeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function getPromoCode(){
  const str = String(UID);
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i)) >>> 0; }
  return 'SMKZ-' + (10000 + (hash % 90000));
}

/* ======================================================================
   STATE

let orders = storeGet('smokeez_orders_' + UID, []);
let favorites = new Set(storeGet('smokeez_favs_' + UID, []));
let checkout = { method:'delivery', payment:'card', contactType:'telegram' };
let pendingFlavor = null;

function productById(id){ return PRODUCTS.find(p => p.id === id); }
function cartTotal(){
  return cart.reduce((sum, ci) => { const p = productById(ci.productId); return sum + (p && p.price ? p.price * ci.qty : 0); }, 0);
}
function cartCount(){ return cart.reduce((s, ci) => s + ci.qty, 0); }
function isFavorite(id){ return favorites.has(id); }
function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
  storeSet('smokeez_favs_' + UID, [...favorites]);
}

/* ======================================================================

function goto(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('nav.bottom-nav button[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  window.scrollTo(0,0);
  if(view === 'cart') renderCart();
  if(view === 'profile') renderProfile();
  if(view === 'catalog') renderCatalog();
  if(view === 'favorites') renderFavorites();
}
document.querySelectorAll('nav.bottom-nav button[data-view]').forEach(btn => {

function thumbHtml(product, size){
  const ph = `<div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 11h18"/></svg>
      <span>${size==='sm' ? '' : 'фото скоро будет'}</span>
    </div>`;
  return `<img src="${product.img}" alt="${product.name}" loading="lazy"
      onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
      onerror="this.style.display='none';" style="display:none;">${ph}`;
}

function buildCatFilters(){
  const el = document.getElementById('catFilters');
  el.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'cat-chip' + (activeCat==='all' ? ' active' : '');
  all.textContent = 'Всё';
  all.addEventListener('click', () => { activeCat = 'all'; renderCatalog(); });
  el.appendChild(all);
  CATEGORIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (activeCat===c.key ? ' active' : '');
    chip.textContent = c.label;
    chip.addEventListener('click', () => { activeCat = c.key; renderCatalog(); });
    el.appendChild(chip);
  });
}

function productCardHtml(p){
  const availCount = p.items.filter(i => i.ok).length;
  const allOut = availCount === 0;
  const priceHtml = p.price
    ? `<div class="price">${p.price.toFixed(2).replace('.',',')} €</div>`
    : `<div class="price ask">Цена по запросу</div>`;
  const tag = p.promo
    ? `<span class="tag promo">${p.promo}</span>`
    : (allOut ? `<span class="tag out">Нет в наличии</span>` : '');
  const fav = isFavorite(p.id);
  return `<div class="product-card" data-id="${p.id}">
      <div class="thumb">${tag}<button type="button" class="fav-btn ${fav?'active':''}" data-fav="${p.id}">${fav ? '♥' : '♡'}</button>${thumbHtml(p)}</div>
      <div class="card-body">
        <div class="name">${p.name}</div>
        <div class="meta">${availCount}/${p.items.length} вкусов в наличии</div>
        ${priceHtml}
      </div>
    </div>`;
}

function bindProductGrid(grid){
  grid.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(btn.dataset.fav);
      haptic('light');
      btn.classList.toggle('active');
      btn.textContent = btn.classList.contains('active') ? '♥' : '♡';
      if(document.getElementById('view-favorites').classList.contains('active')) renderFavorites();
    });
  });
  grid.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', () => openProduct(card.dataset.id));
  });
}

  buildCatFilters();
  const grid = document.getElementById('productGrid');

  const list = PRODUCTS.filter(p => {
    if(activeCat !== 'all' && p.category !== activeCat) return false;
    if(stockOnly && !p.items.some(i => i.ok)) return false;
    if(!t) return true;
    if(p.name.toLowerCase().includes(t)) return true;
    return p.items.some(i => i.n.toLowerCase().includes(t));
  });
  if(list.length === 0){
    const catMsg = (!t && activeCat !== 'all' && EMPTY_CATEGORY_MSG[activeCat]) ? EMPTY_CATEGORY_MSG[activeCat] : 'Ничего не найдено';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div>${catMsg}</div></div>`;
    return;
  }
  grid.innerHTML = list.map(productCardHtml).join('');
  bindProductGrid(grid);
}

  const list = PRODUCTS.filter(p => favorites.has(p.id));

let pdQty = 1;

function openProduct(id){
  currentProductId = id;
  const p = productById(id);
  if(!p) return;
  const firstAvail = p.items.find(i => i.ok);
  pendingFlavor = firstAvail ? firstAvail.n : null;
  pdQty = 1;
  renderProductDetail();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-product').classList.add('active');
  window.scrollTo(0,0);
}

function hueFor(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 360; }
  return h;
}

function renderProductDetail(){
  const p = productById(currentProductId);
  if(!p) return;
  const body = document.getElementById('productDetailBody');
  const priceHtml = p.price
    ? `<div class="pd-price">${p.price.toFixed(2).replace('.',',')} € <span style="font-size:0.65em;color:var(--muted-dim);font-family:'Manrope',sans-serif;font-style:normal;">/ ${p.unit}</span></div>`
    : `<div class="pd-price ask">Цена по запросу — уточним в переписке</div>`;
  const flavorChips = p.items.map(item => {
    const isSel = pendingFlavor === item.n;
    const hue = hueFor(item.n);
    const dotColor = item.ok ? `hsl(${hue}, 78%, 62%)` : 'var(--muted-dim)';
    return `<div class="flavor-chip ${item.ok ? '' : 'out'} ${isSel ? 'selected' : ''}" data-flavor="${encodeURIComponent(item.n)}" data-ok="${item.ok}">
        <span class="dot" style="background:${isSel ? '#fff' : dotColor}"></span>${item.n}${item.ok ? '' : ' · нет'}
      </div>`;
  }).join('');
  const canBuy = !!pendingFlavor;
  const favActive = isFavorite(p.id);
  body.innerHTML = `
    <div class="pd-hero">${thumbHtml(p, 'lg').replace('фото скоро будет', 'фото скоро появится')}<button type="button" class="fav-btn ${favActive?'active':''}" id="pdFavBtn">${favActive ? '♥' : '♡'}</button></div>
    <h1 class="pd-title">${p.name}</h1>
    ${priceHtml}
    ${p.desc ? `<p class="pd-desc">${p.desc}</p>` : ''}
    <div class="pd-block">
      <div class="lbl">${p.variantLabel} · выбери один</div>
      <div class="flavor-grid" id="pdFlavorGrid">${flavorChips}</div>
    </div>
    <div class="pd-block">
      <div class="lbl">Количество</div>
      <div class="qty-stepper" id="pdQtyStepper">
        <button type="button" data-d="-1">−</button>
        <span class="val" id="pdQtyVal">${pdQty}</span>
        <button type="button" data-d="1">+</button>
      </div>
    </div>
    <div class="pd-actions">
      <button class="btn btn-ghost" id="pdAddCart" ${canBuy ? '' : 'disabled'}>В корзину</button>
      <button class="btn btn-primary" id="pdBuyNow" ${canBuy ? '' : 'disabled'}>Купить сейчас</button>
    </div>
    ${p.note ? `<div class="pd-note">${p.note}</div>` : ''}
  `;
  body.querySelectorAll('.flavor-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if(chip.dataset.ok !== 'true') return;
      pendingFlavor = decodeURIComponent(chip.dataset.flavor);
      haptic('light');
      renderProductDetail();
    });
  });
  const favBtn = document.getElementById('pdFavBtn');
  if(favBtn) favBtn.addEventListener('click', () => {
    toggleFavorite(p.id);
    haptic('light');
    renderProductDetail();
  });
  const stepper = document.getElementById('pdQtyStepper');
  stepper.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = parseInt(btn.dataset.d, 10);
      pdQty = Math.min(50, Math.max(1, pdQty + d));
      document.getElementById('pdQtyVal').textContent = pdQty;
    });
  });
  const addBtn = document.getElementById('pdAddCart');
  const buyBtn = document.getElementById('pdBuyNow');
  if(addBtn) addBtn.addEventListener('click', () => { addToCart(p.id, pendingFlavor, pdQty); showToast('Добавлено в корзину'); haptic('success'); });
  if(buyBtn) buyBtn.addEventListener('click', () => { addToCart(p.id, pendingFlavor, pdQty); haptic('success'); goto('cart'); setTimeout(()=>startCheckout(), 50); });
}

function persistCart(){ storeSet('smokeez_cart_' + UID, cart); refreshCartBadges(); }

function addToCart(productId, flavor, qty){
  const existing = cart.find(ci => ci.productId === productId && ci.flavor === flavor);
  if(existing){ existing.qty = Math.min(50, existing.qty + qty); }
  else{ cart.push({productId, flavor, qty}); }
  persistCart();
}
function changeCartQty(idx, delta){
  const ci = cart[idx];
  if(!ci) return;
  ci.qty += delta;
  if(ci.qty <= 0){ cart.splice(idx,1); }
  persistCart();
  renderCart();
}
function removeCartItem(idx){
  cart.splice(idx,1);
  persistCart();
  renderCart();
}

function renderCart(){
  refreshCartBadges();
  const body = document.getElementById('cartBody');
  if(cart.length === 0){
    body.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <div>Корзина пуста<br><span style="font-size:0.8rem;">Загляни в каталог и выбери что-нибудь вкусное</span></div>
    </div>`;
    return;
  }
  const rows = cart.map((ci, idx) => {
    const p = productById(ci.productId);
    if(!p) return '';
    const lineTotal = p.price ? (p.price * ci.qty) : null;
    return `<div class="cart-item">
        <div class="thumb-sm">${thumbHtml(p, 'sm')}</div>
        <div class="ci-info">
          <div class="ci-name">${p.name}</div>
          <div class="ci-flavor">${ci.flavor}</div>
          <div class="ci-row">
            <div class="qty-stepper" data-idx="${idx}">
              <button type="button" data-d="-1">−</button>
              <span class="val">${ci.qty}</span>
              <button type="button" data-d="1">+</button>
            </div>
            <span class="ci-price">${lineTotal!==null ? lineTotal.toFixed(2).replace('.',',')+' €' : 'по запросу'}</span>
          </div>
        </div>
        <button class="rm" data-idx="${idx}">✕</button>
      </div>`;
  }).join('');
  const total = cartTotal();
  const hasAsk = cart.some(ci => { const p = productById(ci.productId); return p && p.price===null; });
  body.innerHTML = rows + `
    <div class="cart-summary">
      <div class="row"><span>Товаров</span><span>${cartCount()} шт</span></div>
      <div class="row total"><span>Итого</span><span>${total.toFixed(2).replace('.',',')} €${hasAsk ? ' +' : ''}</span></div>
      ${hasAsk ? '<div class="row" style="font-size:0.72rem;">+ позиции с ценой по запросу — сумма уточняется в переписке</div>' : ''}
    </div>
    <button class="btn btn-primary btn-wide btn-block" id="cartCheckoutBtn" style="margin-top:16px;">Оформить заказ</button>
  `;
  body.querySelectorAll('.qty-stepper').forEach(st => {
    st.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => changeCartQty(parseInt(st.dataset.idx,10), parseInt(btn.dataset.d,10)));
    });
  });
  body.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', () => removeCartItem(parseInt(btn.dataset.idx,10)));
  });
  const coBtn = document.getElementById('cartCheckoutBtn');
  if(coBtn) coBtn.addEventListener('click', () => { goto('checkout'); startCheckout(); });
}

  };

}

function paymentOptionsFor(method){
  return method === 'delivery'
    ? [['card','💳','Оплата картой'],['crypto','₿','Оплата криптовалютой']]
    : [['card','💳','Оплата картой'],['crypto','₿','Оплата криптовалютой'],['cash','💵','Наличными при получении']];
}

          <div class="field" style="flex:0 0 90px;"><label>Дом</label><input type="text" id="fHouse" value="${checkout.house||''}" placeholder="№"></div>

          <label>E-mail</label>

      ` : ''}
    </div>

function validateCheckout(){
  const errs = [];
  if(!checkout.name || checkout.name.trim().length < 2) errs.push('Укажи своё имя');
  if(checkout.method === 'delivery'){
    if(!checkout.street) errs.push('Укажи улицу');
    if(!checkout.house) errs.push('Укажи номер дома');
    if(!checkout.city) errs.push('Укажи город');
    if(!checkout.postal) errs.push('Укажи индекс');
    if(!checkout.phone || !/^\+?[0-9\s()-]{6,}$/.test(checkout.phone)) errs.push('Укажи корректный номер телефона');
    if(!checkout.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(checkout.email)) errs.push('Укажи корректный e-mail');
  }
  if(!checkout.contactValue) errs.push('Укажи контакт для связи');
  else if(checkout.contactType === 'telegram' && !checkout.contactValue.trim().startsWith('@')) errs.push('Telegram-юзернейм должен начинаться с @');
  else if(checkout.contactType === 'phone' && !checkout.contactValue.trim().startsWith('+')) errs.push('Номер телефона должен начинаться с +');
  return errs;
}

function buildOrderText(){
  const payLabels = {card:'Карта', crypto:'Криптовалюта', cash:'Наличные'};
  let text = `🛒 <b>Новый заказ ${CONFIG.SHOP_NAME}</b>\n\n`;
  cart.forEach(ci => {
    const p = productById(ci.productId);
    if(!p) return;
    const lt = p.price ? (p.price*ci.qty).toFixed(2).replace('.',',')+' €' : 'цена по запросу';
    text += `• ${p.name} — ${ci.flavor} × ${ci.qty} (${lt})\n`;
  });
  text += `\n💰 Итого: ${cartTotal().toFixed(2).replace('.',',')} €\n`;
  text += `\n📦 Способ: ${checkout.method === 'delivery' ? 'Доставка' : 'Самовывоз'}\n`;
  text += `👤 Имя: ${checkout.name}\n`;
  if(checkout.method === 'delivery'){
    text += `🏠 Адрес: ${checkout.street} ${checkout.house}, ${checkout.city}, ${checkout.postal}\n`;
    text += `📞 Телефон: ${checkout.phone}\n`;
    text += `✉️ Email: ${checkout.email}\n`;
  }
  text += `💬 Связь: ${checkout.contactValue} (${checkout.contactType === 'telegram' ? 'Telegram' : 'телефон'})\n`;
  text += `💳 Оплата: ${payLabels[checkout.payment]}\n`;
  if(tgUser) text += `\n🆔 Telegram: ${tgUser.first_name||''} ${tgUser.username ? '(@'+tgUser.username+')' : ''} · id ${tgUser.id}\n`;
  text += `🏷 Промокод клиента: ${getPromoCode()}`;
  return text;
}

async function sendOrderToOwner(text){
  const ready = CONFIG.BOT_TOKEN && CONFIG.BOT_TOKEN !== 'YOUR_BOT_TOKEN' && CONFIG.OWNER_CHAT_ID && CONFIG.OWNER_CHAT_ID !== 'YOUR_CHAT_ID';
  if(!ready) return false;
  try{
    const resp = await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: CONFIG.OWNER_CHAT_ID, text, parse_mode:'HTML'})
    });
    const data = await resp.json();
    return !!data.ok;
  }catch(e){ return false; }
}

async function submitOrder(){
  const errs = validateCheckout();
  const errBox = document.getElementById('coError');
  if(errs.length){
    errBox.style.display = 'block';
    errBox.innerHTML = errs.map(e => '• '+e).join('<br>');
    errBox.scrollIntoView({behavior:'smooth', block:'center'});
    haptic('error');
    return;
  }
  errBox.style.display = 'none';
  const btn = document.getElementById('submitOrderBtn');
  btn.disabled = true; btn.textContent = 'Отправляем...';

  const orderText = buildOrderText();
  const sent = await sendOrderToOwner(orderText);

  if(!sent){
    try{ await navigator.clipboard.writeText(orderText.replace(/<\/?b>/g,'')); }catch(e){}
    const link = `https://t.me/${CONFIG.OWNER_USERNAME}`;
    if(tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, '_blank');
    showToast('Заказ скопирован — вставь его в открывшийся чат');
  }

  orders.unshift({ date: new Date().toISOString(), items: cart.map(ci=>({...ci})), total: cartTotal(), method: checkout.method, payment: checkout.payment });
  storeSet('smokeez_orders_' + UID, orders.slice(0,30));
  cart = [];
  persistCart();
  haptic('success');

  document.getElementById('checkoutBody').innerHTML = `
    <div class="success-box">
      <div class="ic">✅</div>
      <h2>Заказ принят!</h2>
      <p>Мы свяжемся с тобой в Telegram (${checkout.contactValue}) в ближайшее время, чтобы подтвердить заказ и прислать реквизиты для оплаты.</p>
      <button class="btn btn-primary" style="margin-top:20px;" id="backToCatalogBtn">В каталог</button>
    </div>`;
  document.getElementById('backToCatalogBtn').addEventListener('click', () => goto('catalog'));
}

    ordersHtml = `<div class="empty-state" style="padding:32px 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <div style="font-size:0.85rem;">Заказов пока нет</div>
    </div>`;
  }else{
    ordersHtml = `<div class="orders-list">` + orders.map(o => {
      const d = new Date(o.date);
      const dateStr = d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
      const itemsStr = o.items.map(ci => { const p = productById(ci.productId); return p ? `${p.name} (${ci.flavor}) × ${ci.qty}` : ''; }).filter(Boolean).join('<br>');
      return `<div class="order-card">
          <div class="oc-top"><span>${dateStr}</span><span>${o.method === 'delivery' ? 'Доставка' : 'Самовывоз'}</span></div>
          <div class="oc-items">${itemsStr}</div>
          <div class="oc-total">${o.total.toFixed(2).replace('.',',')} €</div>
        </div>`;
    }).join('') + `</div>`;
  }

  body.innerHTML = head + `<h2 class="section-title">История заказов</h2>` + ordersHtml;

  const copyBtn = document.getElementById('copyPromoBtn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(promo); showToast('Промокод скопирован'); haptic('light'); }
    catch(e){ showToast('Не удалось скопировать'); }
  });
}

/* ======================================================================
   ФОНОВЫЕ ЧАСТИЦЫ
   ====================================================================== */
(function spawnParticles(){
  const field = document.getElementById('smokeField');
  const n = window.innerWidth < 640 ? 10 : 16;
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'particle';
    const size = 4 + Math.random()*10;
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.left = (Math.random()*100)+'%';
    el.style.setProperty('--drift', (Math.random()*60-30)+'px');
    const dur = 16 + Math.random()*20;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = (-Math.random()*dur)+'s';
    field.appendChild(el);
  }
})();

/* ======================================================================
   ИНИЦИАЛИЗАЦИЯ
   ====================================================================== */
refreshCartBadges();
renderCatalog();

if(tg && tg.BackButton){
  tg.BackButton.onClick(() => {
    const activeView = document.querySelector('.view.active').id.replace('view-','');
    if(activeView === 'product') goto('catalog');
    else if(activeView === 'checkout') goto('cart');
    else if(activeView !== 'catalog') goto('catalog');
  });
  const nav = new MutationObserver(() => {
    const activeView = document.querySelector('.view.active').id.replace('view-','');
    if(activeView === 'catalog') tg.BackButton.hide(); else tg.BackButton.show();
  });
  document.querySelectorAll('.view').forEach(v => nav.observe(v, {attributes:true, attributeFilter:['class']}));
}
</script>
